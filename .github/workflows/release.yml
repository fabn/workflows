name: Bump major tag

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  bump-major-tag:
    name: Move floating major tag
    runs-on: ubuntu-latest
    if: ${{ !github.event.release.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Compute major tag
        id: major
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag '$RELEASE_TAG' is not a vMAJOR.MINOR.PATCH semver tag — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MAJOR_TAG="${RELEASE_TAG%%.*}"
          echo "major_tag=$MAJOR_TAG" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Move major tag
        if: steps.major.outputs.skip != 'true'
        run: |
          git tag -f ${{ steps.major.outputs.major_tag }} ${{ steps.major.outputs.release_tag }}
          git push origin refs/tags/${{ steps.major.outputs.major_tag }} --force

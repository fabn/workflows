name: Docker Build Multi-Arch

# Multi-arch variant of docker-build.yml: builds the image natively on one
# runner per platform (no QEMU emulation), pushes each platform build by
# digest only, then merges the digests into a single multi-arch manifest list
# carrying the same tags docker-build.yml would emit.
# Pattern from https://docs.docker.com/build/ci/github-actions/multi-platform/

on:
  workflow_call:
    inputs:
      image_name:
        description: >-
          Base image name (registry/namespace/name, without tag) used for the
          auto-generated tags and the workflow outputs. Defaults to
          <registry>/<owner>/<repo>.
        required: false
        type: string
      build_args:
        description: Optional additional build args given to docker build command
        type: string
      context:
        description: Docker build context path
        required: false
        type: string
        default: .
      dockerfile:
        description: Path to the Dockerfile (repo-root relative). Defaults to <context>/Dockerfile when not given.
        required: false
        type: string
      target:
        description: >-
          Dockerfile stage to build. Empty (the default) builds the last stage
          in the file, which is what a bare `docker build` does — so a caller
          that does not set this is unaffected.
        required: false
        type: string
      push:
        description: >-
          Whether to push the built image to the registry. Set to false to
          build without pushing, e.g. a pull-request smoke test; the merge
          job is skipped since there are no pushed digests to merge.
        required: false
        type: boolean
        default: true
      ref:
        description: The ref to build the image for
        type: string
      registry:
        description: Registry to login to and push the image to
        required: false
        type: string
        default: ghcr.io
      registry_username:
        description: Username used to login to the registry
        required: false
        type: string
        default: ${{ github.repository_owner }}
      runners:
        description: >-
          JSON array of {platform, runner} pairs, one native build each.
          Override it to build other platforms or to use different (e.g.
          self-hosted) runners.
        required: false
        type: string
        default: >-
          [{"platform": "linux/amd64", "runner": "ubuntu-latest"},
           {"platform": "linux/arm64", "runner": "ubuntu-24.04-arm"}]
      cache_from:
        description: >-
          buildx cache-from source. Empty (default) => the per-platform GHA
          cache (type=gha,scope=<image>-<platform>). Override verbatim for a
          different backend (e.g. a registry cache).
        required: false
        type: string
        default: ''
      cache_to:
        description: >-
          buildx cache-to target. Empty (default) => the per-platform GHA cache
          with ignore-error
          (type=gha,mode=max,scope=<image>-<platform>,ignore-error=true) so a flaky or
          concurrently-racing cache export never fails the build — the image is
          already built and pushed by then. Override verbatim for a different
          backend, or set to 'type=inline' / '' handling as needed.
        required: false
        type: string
        default: ''
    secrets:
      registry_password:
        description: >-
          Password or token used to login to the registry. Defaults to
          GITHUB_TOKEN, which is all ghcr.io needs.
        required: false
      build_secrets:
        description: >-
          Secrets forwarded verbatim to docker/build-push-action's `secrets`
          input: one `id=value` per line, consumed in the Dockerfile with
          `RUN --mount=type=secret,id=<id>`. Use this rather than `build_args`
          for anything credential-shaped — build args are recorded in image
          history and readable from the pushed image.
        required: false
    outputs:
      image:
        description: Built multi-arch image name (base:tag)
        value: ${{ jobs.merge.outputs.image }}
      base:
        description: Built image base name (without tag)
        value: ${{ jobs.merge.outputs.base }}
      tag:
        description: The tag of the built image
        value: ${{ jobs.merge.outputs.tag }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include: ${{ fromJSON(inputs.runners) }}
    env:
      # Base image name for tagging and outputs: the explicit override when
      # given, otherwise the repository name on the target registry.
      image_base: ${{ inputs.image_name != '' && inputs.image_name || format('{0}/{1}', inputs.registry, github.repository) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Sanitize platform and image names
        # Slashes and colons are invalid in artifact names, and a comma (a
        # runners entry can carry several platforms for a single cross-build
        # job) would be read as the separator of the next buildx cache option.
        # The image slug scopes artifacts and cache per image, so a workflow
        # run can call this reusable once per image without the digest
        # artifacts colliding or the caches overwriting each other.
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          {
            echo "PLATFORM_PAIR=$(echo "$PLATFORM" | tr '/,' '--')"
            echo "IMAGE_SLUG=$(echo "$image_base" | tr '/:' '--')"
          } >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to registry
        # Only needed when the image is actually pushed (e.g. skipped on a PR smoke test)
        if: ${{ inputs.push }}
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.registry_username }}
          password: ${{ secrets.registry_password || secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: docker
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          # Default the Dockerfile to <context>/Dockerfile when not given, as
          # docker-build.yml does.
          file: ${{ inputs.dockerfile != '' && inputs.dockerfile || format('{0}/Dockerfile', inputs.context) }}
          target: ${{ inputs.target }}
          platforms: ${{ matrix.platform }}
          # Push by digest only: no per-arch tags in the registry, the merge
          # job assembles the manifest list and applies the real tags.
          outputs: ${{ inputs.push && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.image_base) || '' }}
          build-args: |
            ${{ inputs.build_args }}
            APP_REVISION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
            APP_DIST=${{ github.sha }}
            BRANCH=${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
            SHA=${{ github.sha }}
            DD_GIT_REPOSITORY_URL=${{ github.repositoryUrl }}
            DD_GIT_COMMIT_SHA=${{ github.sha }}
          # Credentials belong here and not in build-args: BuildKit exposes
          # these for the lifetime of a single RUN and they never reach a layer
          # or the image history. Empty string when the caller sets nothing,
          # which the action ignores.
          secrets: ${{ secrets.build_secrets }}
          # Default to the per-platform GHA cache; ignore-error on export so a
          # flaky or concurrently-racing "failed to reserve cache" never fails
          # the build (the image is already built/pushed by then). An explicit
          # input overrides verbatim (e.g. a registry cache).
          cache-from: ${{ inputs.cache_from != '' && inputs.cache_from || format('type=gha,scope={0}-{1}', env.IMAGE_SLUG, env.PLATFORM_PAIR) }}
          cache-to: ${{ inputs.cache_to != '' && inputs.cache_to || format('type=gha,mode=max,scope={0}-{1},ignore-error=true', env.IMAGE_SLUG, env.PLATFORM_PAIR) }}
      - name: Export digest
        if: ${{ inputs.push }}
        env:
          DIGEST: ${{ steps.docker.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - name: Upload digest
        if: ${{ inputs.push }}
        uses: actions/upload-artifact@v7
        with:
          # Scoped by image too: a single workflow run can build more than one
          name: digests-${{ env.IMAGE_SLUG }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge platform manifests
    if: ${{ inputs.push }}
    runs-on: ubuntu-latest
    needs: build
    env:
      image_base: ${{ inputs.image_name != '' && inputs.image_name || format('{0}/{1}', inputs.registry, github.repository) }}
    outputs:
      image: ${{ steps.image.outputs.image }}
      base: ${{ steps.image.outputs.base }}
      tag: ${{ steps.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Compute image slug
        run: echo "IMAGE_SLUG=$(echo "$image_base" | tr '/:' '--')" >> "$GITHUB_ENV"
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ env.IMAGE_SLUG }}-*
          merge-multiple: true
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.image_base }}
          # Same tagging scheme as docker-build.yml, see the comments there
          tags: |
            type=ref,event=tag
            type=ref,event=branch,suffix=-{{ sha }}
            type=sha,format=short,enable=${{ github.event_name == 'pull_request'}},prefix=${{ github.event.pull_request.head.ref }}-
            type=raw,value=latest,enable={{is_default_branch}}
          # Disable latest tag on tagged images, latest is main
          flavor:
            latest=false
          # Fetch git metadata instead of workflow context, since might be triggered from main comments
          context: git
      - name: Login to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.registry_username }}
          password: ${{ secrets.registry_password || secrets.GITHUB_TOKEN }}
      - name: Create manifest list and push
        # One -t per generated tag, one <image>@sha256:<digest> per platform
        # build (the digest files uploaded by the build jobs)
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          tag_args=()
          for tag in "${tags[@]}"; do tag_args+=(-t "$tag"); done
          digest_args=()
          for digest in *; do digest_args+=("$image_base@sha256:$digest"); done
          docker buildx imagetools create "${tag_args[@]}" "${digest_args[@]}"
      - name: Image outputs
        id: image
        env:
          version: ${{ steps.meta.outputs.version }}
        run: |
          {
            echo "image=$image_base:$version"
            echo "base=$image_base"
            echo "tag=$version"
          } >> "$GITHUB_OUTPUT"
      - name: Inspect image
        env:
          image: ${{ steps.image.outputs.image }}
        run: docker buildx imagetools inspect "$image"

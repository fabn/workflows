name: docker-build-multi smoke test

# TEMPORARY end-to-end configuration: the default build pushes for real to
# ghcr.io so the merge job, the manifest list and the per-platform images can
# be verified on this PR. To be reverted to a push-less configuration (like
# docker-build-test.yml) before merging.

on:
  pull_request:
    paths:
      - .github/workflows/docker-build-multi.yml
      - .github/workflows/docker-build-multi-test.yml
      - Dockerfile
  push:
    branches: [main]
    paths:
      - .github/workflows/docker-build-multi.yml
      - .github/workflows/docker-build-multi-test.yml
      - Dockerfile
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: Build and push both platforms natively
    uses: ./.github/workflows/docker-build-multi.yml
    secrets: inherit

  build-skip-push:
    name: Build a single platform without pushing
    uses: ./.github/workflows/docker-build-multi.yml
    with:
      push: false
      runners: '[{"platform": "linux/amd64", "runner": "ubuntu-latest"}]'
    secrets: inherit

  assert-outputs:
    name: Assert outputs
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Outputs resolve to the repository image on ghcr.io
        env:
          IMAGE: ${{ needs.build-push.outputs.image }}
          BASE: ${{ needs.build-push.outputs.base }}
          TAG: ${{ needs.build-push.outputs.tag }}
          EXPECTED_BASE: ghcr.io/${{ github.repository }}
        run: |
          echo "image=$IMAGE base=$BASE tag=$TAG"
          test "$BASE" = "$EXPECTED_BASE"
          test -n "$TAG"
          test "$IMAGE" = "$EXPECTED_BASE:$TAG"

  verify-manifest:
    name: Verify multi arch manifest
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Manifest list contains exactly amd64 and arm64
        env:
          IMAGE: ${{ needs.build-push.outputs.image }}
        run: |
          archs=$(docker buildx imagetools inspect --raw "$IMAGE" \
            | jq -r '[.manifests[].platform.architecture | select(. != "unknown")] | sort | unique | join(",")')
          echo "architectures: $archs"
          test "$archs" = "amd64,arm64"

  run-image:
    name: Run image on ${{ matrix.platform }}
    needs: build-push
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: amd64
            machine: x86_64
          - runner: ubuntu-24.04-arm
            platform: arm64
            machine: aarch64
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image runs natively on ${{ matrix.platform }}
        env:
          IMAGE: ${{ needs.build-push.outputs.image }}
          EXPECTED: ${{ matrix.machine }}
        run: |
          machine=$(docker run --rm --entrypoint uname "$IMAGE" -m)
          echo "uname -m: $machine"
          test "$machine" = "$EXPECTED"

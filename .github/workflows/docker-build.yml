name: Docker Build

on:
  workflow_call:
    inputs:
      image:
        description: Image name, computed from repo name if not given
        required: false
        type: string
      image_name:
        description: >-
          Base image name (registry/namespace/name, without tag) used for the
          auto-generated tags and the workflow outputs. Defaults to
          ghcr.io/<owner>/<repo>. Override it to publish a sidecar/utility
          image under a different name from the same repository.
        required: false
        type: string
      build_args:
        description: Optional additional build args given to docker build command
        type: string
      context:
        description: Docker build context path
        required: false
        type: string
        default: .
      dockerfile:
        description: Path to the Dockerfile, relative to the build context (defaults to <context>/Dockerfile)
        required: false
        type: string
      platforms:
        description: Target platforms for the build (comma separated)
        required: false
        type: string
        default: linux/amd64
      push:
        description: >-
          Whether to push the built image to the registry. Set to false to
          build without pushing, e.g. a pull-request smoke test.
        required: false
        type: boolean
        default: true

      ref:
        description: The ref to build the image for
        type: string
    outputs:
      image:
        description: Built Image name (the first one from the given list)
        value: ${{ jobs.docker.outputs.image }}
      base:
        description: Built Image base name (without tag)
        value: ${{ jobs.docker.outputs.base }}
      tag:
        description: The tag of the built image, possibly empty
        value: ${{ jobs.docker.outputs.version }}

# Adapted from https://evilmartians.com/chronicles/build-images-on-github-actions-with-docker-layer-caching
jobs:
  docker:
    name: Build and push
    runs-on: ubuntu-latest
    env:
      # Base image name for tagging and outputs: the explicit override when
      # given, otherwise the repository name on ghcr.io (the historical default).
      image_base: ${{ inputs.image_name != '' && inputs.image_name || format('ghcr.io/{0}', github.repository) }}
    outputs:
      image: ${{ inputs.image_name != '' && inputs.image_name || format('ghcr.io/{0}', github.repository) }}:${{ steps.meta.outputs.version }}
      base: ${{ inputs.image_name != '' && inputs.image_name || format('ghcr.io/{0}', github.repository) }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          # Base image name and registry (repository by default, overridable)
          images: ${{ env.image_base }}
          # If is a tag use it, otherwise uses the short sha with branch-prefix
          # See also https://github.com/docker/metadata-action/issues/485
          # See https://github.com/docker/metadata-action?tab=readme-ov-file#typeref
          # See https://github.com/docker/metadata-action?tab=readme-ov-file#priority-attribute
          # This configuration will emit
          # - ghcr.io/owner/repo:tag on tags
          # - ghcr.io/owner/repo:<branch-slug>-<sha> on pull request
          # - ghcr.io/owner/repo:<branch-slug>-<sha> on default branch
          # - ghcr.io/owner/repo:latest on main on default branch
          tags: |
            type=ref,event=tag
            type=ref,event=branch,suffix=-{{ sha }}
            type=sha,format=short,enable=${{ github.event_name == 'pull_request'}},prefix=${{ github.event.pull_request.head.ref }}-
            type=raw,value=latest,enable={{is_default_branch}}
          # Disable latest tag on tagged images, latest is main
          flavor:
            latest=false
          # Fetch git metadata instead of workflow context, since might be triggered from main comments
          context: git
      - name: Login to GitHub Container Registry
        # Only needed when the image is actually pushed (e.g. skipped on a PR smoke test)
        if: ${{ inputs.push }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: docker
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          # When explicit name is given use that otherwise use the one from metadata
          tags: |
            ${{ inputs.image }}
            ${{ steps.meta.outputs.tags }}
          build-args: |
            ${{ inputs.build_args }}
            APP_REVISION=${{ github.ref_type == 'tag' && github.ref_name || (github.event_name == 'pull_request' && github.event.pull_request.ref.head || (github.sha)) }}
            APP_DIST=${{ github.sha }}
            BRANCH=${{ github.event_name == 'pull_request' && github.event.pull_request.ref.head || github.ref_name }}
            SHA=${{ github.sha }}
            DD_API_KEY=${{ secrets.DD_API_KEY }}
            DD_GIT_REPOSITORY_URL=${{ github.repositoryUrl }}
            DD_GIT_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Add dynamic labels to the image
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
